# Annual time; composite goods and unit household time endowment.
[economic]
rho = 0.04
gamma = 2.0
epsilon = 7.0
varphi = 5.0
A = 1.0
chi = 1874.5714285714287 # (6/7)*3^7: flexible C=N=1/3
K = 0.0015             # provisional fixed composite-good expense
sigma_a = 0.20        # log taste / sqrt(year)
lambda0 = 0.50        # intensity coefficient in annual spending units
omega = 0.50
premium = 0.05        # delta_Q, log-quality premium
sigma_Q = 0.20
pi_target = 0.01980262729617973
phi_pi = 1.5

[initial]
mean_a = -0.03
sd_a = 0.12
mean_b = -0.03
variance = 0.04
log_nominal_price = 0.0

[numerical]
dt = 0.25
steps = 8
nx = 9
na = 7
nb = 5
nv = 4
xmin = -0.45
xmax = 0.45
amin = -0.90
amax = 0.90
bmin = -0.80
bmax = 0.80
# Terminal closure is a finite-horizon approximation, not a stationary GE.
price_temperature = 0.00001 # numerical smoothing; check the zero-temperature limit
terminal_consumption = 0.3333333333333333
terminal_value = "frozen" # "frozen" single-firm continuation, or "zero"
terminal_iterations = 500
terminal_tolerance = 1.0e-7
max_iterations = 55
tolerance = 1.0e-5
jacobian_refresh = 5
output = "results"
